
name: Day 1 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f README.md
          test -f app/index.html
          echo "All project files exist!"


- name: Validate HTML heading
        run: grep -q '<h1>Hello, DevOps!</h1>' app/index.html
             echo "html heading validation passed"
