name: Day 2 - File and HTML Validation

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Starting file validation..."

          test -f README.md || { echo "ERROR: README.md is missing"; exit 1; }
          test -f app/index.html || { echo "ERROR: app/index.html is missing"; exit 1; }

          echo "SUCCESS: All required files exist!"

      - name: Validate HTML heading
        run: |
          grep -q '<h1>Hello, DevOps!</h1>' app/index.html
          echo "SUCCESS: HTML heading validation passed!"
