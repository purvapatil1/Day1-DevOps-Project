name: Day 4 - Enhanced HTML Validation

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f index.html
          test -f app/index.html
          echo "SUCCESS: All required files exist!"

      - name: Validate HTML heading
        run: |
          set -e
          grep -q '<h1>Hello, DevOps!</h1>' app/index.html
          echo "SUCCESS: HTML heading validation passed!"

      - name: Validate heading count
        run: |
          count=$(grep -o '<h1>' app/index.html | wc -l)
          echo "Found $count h1 heading(s)"
          test "$count" -eq 1
          echo "SUCCESS: Exactly one h1 heading found!"
